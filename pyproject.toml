[project]
name = "rss-aggregator"
version = "0.1.0"
description = "Local FreshRSS lifecycle and development commands"
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9"]

[project.scripts]
rss = "rss_aggregator.cli:main"
rss-dev = "rss_aggregator.development:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_aggregator"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15", "pre-commit>=4,<5"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live"'
markers = ["live: opt-in real Podman/HTTP integration checks"]
